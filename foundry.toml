[profile.default]
src = "contracts/src"
out = "contracts/out"
test = "contracts/test"
script = "contracts/script"
libs = ["contracts/lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
chain_id = 10143

# Monad Testnet RPC Configuration
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# Etherscan / Explorer configuration for verification
[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY}", url = "https://testnet.monadexplorer.com/api" }
